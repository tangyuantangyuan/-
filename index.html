<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#191919">
  <title>Notebook</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="studio.css">
  <link rel="stylesheet" href="binding.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header class="topbar"><div class="top-actions">
    <span id="saveStatus" class="visually-hidden" aria-live="polite">Loading…</span>
    <button id="libraryBtn">Library</button><button id="pagesToggle" class="tablet-control">Pages</button><button id="toolsToggle" class="tablet-control">Tools</button>
    <button id="undoBtn" class="history-action" aria-label="Undo" title="Undo (Ctrl / ⌘ Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5 4 10l5 5M4 10h10a5 5 0 0 1 0 10h-2"/></svg></button><button id="redoBtn" class="history-action" aria-label="Redo" title="Redo (Ctrl / ⌘ Shift Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 5 5 5-5 5m5-5H10a5 5 0 0 0 0 10h2"/></svg></button>
    <button id="settingsBtn" class="quiet">Settings</button><button id="modeBtn" class="primary">Done</button>
  </div></header>
  <main id="app" class="app">
    <aside id="sidebar" class="sidebar" hidden><div class="panel-heading"><h2>Pages</h2><button id="addPageBtn" title="Add a two-sided sheet">+ Sheet</button></div><div id="pageList" class="page-list"></div></aside>
    <section class="workspace"><div class="stage">
      <button id="prevBtn" class="nav prev" aria-label="Previous sheet">‹</button><div id="book" class="book"></div><button id="nextBtn" class="nav next" aria-label="Next sheet">›</button>
    </div><div class="book-caption"><h1 id="bookTitle" role="button" tabindex="0" aria-label="Edit notebook" title="Edit notebook">My journal</h1></div></section>
    <aside id="tools" class="tools" hidden><div class="panel-heading"><h2 id="toolTitle">Selection</h2></div><div id="toolBody"></div></aside>
  </main>
  <dialog id="settingsDialog"><form method="dialog" id="settingsForm" class="dialog-body">
    <div class="dialog-title"><h2>Notebook</h2><button id="settingsCloseBtn" type="button" class="icon-btn" aria-label="Close">×</button></div>
    <label>Title<input id="titleInput" maxlength="80" placeholder="My journal"></label>
    <label class="studio-field">Collection<input id="categoryInput" type="text" maxlength="80" placeholder="Unsorted"></label>
    <div class="field"><span>Shape</span><div class="segmented" id="sizeOptions"></div></div>
    <div class="field"><span>Binding</span><div class="segmented" id="bindingOptions"></div></div>
    <div class="field"><span>Paper</span><div class="segmented" id="paperOptions"></div></div>
    <div class="field"><span>Background</span><div class="segmented" id="themeOptions"></div></div>
    <div class="dialog-footer"><button id="settingsCancelBtn" type="button">Cancel</button><button id="settingsSaveBtn" type="submit" class="primary">Save</button></div>
  </form></dialog>
  <dialog id="importDialog"><div class="dialog-body">
    <div class="dialog-title"><h2>Add image</h2><button id="importCloseBtn" class="icon-btn" aria-label="Close">×</button></div>
    <p id="importFileName" class="muted"></p><button id="cropUpload">Crop first</button>
    <div class="choice-grid">
      <button data-import="sticker"><strong>Sticker</strong></button>
      <button data-import="single-cover"><strong>Page · Fill</strong></button>
      <button data-import="single-contain"><strong>Page · Fit</strong></button>
      <button data-import="spread-cover"><strong>Spread · Fill</strong></button>
      <button data-import="spread-contain"><strong>Spread · Fit</strong></button>
      <button data-import="alpha-shaped"><strong>Shaped paper</strong></button>
    </div><p id="importNote" class="hint"></p>
  </div></dialog>
  <dialog id="libraryDialog" class="library-dialog"><div class="dialog-body">
    <div class="dialog-title"><h2>Library</h2><button id="libraryClose" class="icon-btn" aria-label="Close library">×</button></div>
    <div class="library-actions"><button id="newBook">+ Notebook</button><button id="librarySelect">Select</button><button id="importBackup">Import</button><button id="exportLibrary">Back up all</button></div>
    <div id="libraryFilters"></div>
    <div id="libraryBatch" class="library-batch" hidden><span id="libraryCount" role="status"></span><button id="batchAll">Select all / Clear</button><button id="batchExport">Export</button><button id="batchRestore">Restore</button><button id="batchDelete">Move to trash</button></div>
    <div id="libraryGrid" class="library-grid"></div>
    <details class="offline-details"><summary>Storage</summary><p id="storageUsage"></p><button id="clearLocalData">Clear local data</button></details>
  </div></dialog>
  <dialog id="detailsDialog"><div class="dialog-body"><div class="dialog-title"><h2>Notebook</h2><button id="detailsClose" class="icon-btn" aria-label="Close">×</button></div><div id="detailsFields"></div><div class="dialog-footer"><button id="detailsSave">Save</button></div></div></dialog>
  <dialog id="exportDialog"><div class="dialog-body"><div class="dialog-title"><h2>Backup ready</h2><button id="exportClose" class="icon-btn" aria-label="Close">×</button></div><p id="backupName" class="muted"></p><a id="backupDownload" class="download-link">Save backup</a></div></dialog>
  <dialog id="dangerDialog"><div class="dialog-body"><div class="dialog-title"><h2 id="dangerTitle">Delete permanently</h2></div><p id="dangerMessage" class="muted"></p><label class="studio-field">Type DELETE<input id="dangerWord" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"></label><div class="dialog-footer"><button id="dangerCancel">Cancel</button><button id="dangerConfirm" disabled>Delete</button></div></div></dialog>
  <dialog id="cropDialog" class="image-dialog"><div class="dialog-body">
    <div class="dialog-title"><h2>Crop</h2><button id="cropClose" class="icon-btn" aria-label="Close crop">×</button></div>
    <canvas id="cropCanvas" aria-label="Drag to draw a crop area"></canvas>
    <div class="crop-controls"><label>Ratio<select id="cropRatio"><option value="free">Free</option><option value="1">Square</option><option value="page">Page</option><option value="1.3333333333">4:3</option><option value="1.7777777778">16:9</option></select></label><label><input id="cropMove" type="checkbox"> Move selection</label></div>
    <label class="studio-field">Zoom selection<input id="cropZoom" type="range" min="1" max="100" value="100"></label><output id="cropSize"></output>
    <div class="dialog-footer"><button id="cropReset">Full image</button><button id="cropApply">Apply</button></div>
  </div></dialog>
  <dialog id="pickerDialog" class="image-dialog"><div class="dialog-body">
    <div class="dialog-title"><h2>Pick a colour</h2><button id="pickerClose" class="icon-btn" aria-label="Close colour picker">×</button></div>
    <div id="pickerImages" class="picker-images"></div><canvas id="pickerCanvas" aria-label="Tap an image colour"></canvas>
    <div class="dialog-footer"><span id="pickedColor" class="picked-colour"></span><output id="pickedHex"></output><button id="pickerApply" disabled>Apply</button></div>
  </div></dialog>
  <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp" hidden>
  <input id="backupInput" type="file" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="model.js" defer></script><script src="studio-model.js" defer></script><script src="studio.js" defer></script><script src="editing.js" defer></script><script src="app.js" defer></script>
</body>
</html>
